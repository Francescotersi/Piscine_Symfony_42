<!DOCTYPE html>

<!-- mettere i due h2 uno accanto all'altro capire -->
<!-- creare sue liste, una per il front e un`altra per il back su cui poi aggiungere le barre di progresso -->
<!-- stare attenti ai nomi delle classi nel file css cosi da aggiungere lo styling delle barre -->
<!-- usare flexbox direttamente sul file non sembra funzionare, cerca altri modi -->
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul>
        <li>
            <h2>Frontend</h2>
            <p data-value="80" style="--progresstool-width: 80%;">HTML5</p>
            <progress class="html5" value="80" max="100"></progress>
            
            <p data-value="60" style="--progresstool-width: 60%;">CSS3</p>
            <progress class="css3" value="60" max="100"></progress>
            
            <p data-value="50" style="--progresstool-width: 50%;">jQuery</p>
            <progress class="jquery" value="50" max="100"></progress>
        </li>
        <li>
            <h2>Backend</h2>
            <p data-value="75" style="--progresstool-width: 75%;">Python</p>
            <progress class="python" value="75" max="100"></progress>
            
            <p data-value="65" style="--progresstool-width: 65%;">PHP</p>
            <progress class="php" value="65" max="100"></progress>
            
            <p data-value="35" style="--progresstool-width: 35%;">Node.js</p>
            <progress class="node-js" value="30" max="100"></progress>
        </li>
    </ul>
</body>
</html>
